[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "greenerplatform-mcp"
version = "0.1.1"
description = "MCP server exposing the GreenerPlatform deterministic reliability tools (kubectl-sentinel, incident-triage) to any AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Olawale Ogundiran" }]
keywords = ["mcp", "kubernetes", "sre", "reliability", "incident", "triage", "agent"]
dependencies = ["mcp>=1.2.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/GreenerPlatform/greenerplatform-mcp"
Source = "https://github.com/GreenerPlatform/greenerplatform-mcp"
Issues = "https://github.com/GreenerPlatform/greenerplatform-mcp/issues"

[project.scripts]
greenerplatform-mcp = "greenerplatform_mcp:main"

[tool.setuptools]
py-modules = ["greenerplatform_mcp"]
