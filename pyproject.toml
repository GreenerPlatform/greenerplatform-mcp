[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "greenerplatform-mcp"
version = "0.1.0"
description = "MCP server exposing the GreenerPlatform deterministic reliability tools (kubectl-sentinel, incident-triage) to any AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Olawale Ogundiran" }]
keywords = ["mcp", "kubernetes", "sre", "reliability", "incident", "triage", "agent"]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/GreenerPlatform"
Source = "https://github.com/GreenerPlatform/greenerplatform-mcp"

[project.scripts]
greenerplatform-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
