name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build twine && python -m pip install -e .
      - name: Test
        run: |
          python -m compileall -q greenerplatform_mcp.py tests
          python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m build
          python -m twine check dist/*
